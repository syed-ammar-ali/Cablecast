<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cablecast · No Signal</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #050608;
      --text: #e6faff;
      --amber: #f59e0b;
      --red: #ef4444;
      --cyan: #06b6d4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    /* CRT Scanlines overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.4) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.6;
    }
    /* CRT Radial vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.8) 100%);
      pointer-events: none;
      z-index: 11;
    }
    .crt-card {
      position: relative;
      z-index: 20;
      max-width: 440px;
      width: 100%;
      background: rgba(13, 15, 20, 0.92);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(245, 158, 11, 0.12);
    }
    /* SMPTE Color Bars */
    .color-bars {
      display: flex;
      height: 14px;
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .bar { flex: 1; height: 100%; }
    .bar-1 { background: #c0c0c0; }
    .bar-2 { background: #c0c000; }
    .bar-3 { background: #00c0c0; }
    .bar-4 { background: #00c000; }
    .bar-5 { background: #c000c0; }
    .bar-6 { background: #c00000; }
    .bar-7 { background: #0000c0; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    p {
      color: #9ca3af;
      font-size: 0.8125rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid rgba(245, 158, 11, 0.6);
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000000;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .retry-btn:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #6b7280;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="crt-card">
    <div class="color-bars">
      <div class="bar bar-1"></div>
      <div class="bar bar-2"></div>
      <div class="bar bar-3"></div>
      <div class="bar bar-4"></div>
      <div class="bar bar-5"></div>
      <div class="bar bar-6"></div>
      <div class="bar bar-7"></div>
    </div>

    <div class="badge">
      <span class="pulse-dot"></span>
      <span>No Carrier Signal</span>
    </div>

    <h1>Station Off-Air</h1>
    <p>Cablecast cannot reach the broadcast transmission towers. Check your cellular data or Wi-Fi antenna connection.</p>

    <button type="button" class="retry-btn" onclick="retryConnection()">
      ⚡ Retry Tuning Station
    </button>

    <div class="hint">Tuning will automatically resume once carrier signal is restored.</div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.querySelector('.retry-btn');
      if (btn) {
        btn.textContent = 'Retuning frequencies...';
        btn.style.opacity = '0.7';
      }
      setTimeout(() => {
        window.location.reload();
      }, 300);
    }

    // Auto-reload immediately when online connection returns
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
